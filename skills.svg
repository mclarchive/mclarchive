  stroke="#3fa8ff"
  stroke-opacity=".48"
  stroke-width="1">

  <path d="M42 105V42H105"/>
  <path d="M1095 42H1158V105"/>
  <path d="M42 415V478H105"/>
  <path d="M1095 478H1158V415"/>

</g>


