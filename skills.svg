<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- ================================= -->
  <!-- DARK NAVY SPACE BACKGROUND -->
  <!-- ================================= -->

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#02050d"/>
    <stop offset="38%" stop-color="#061326"/>
    <stop offset="68%" stop-color="#08172d"/>
    <stop offset="100%" stop-color="#02040a"/>
  </linearGradient>

  <!-- BLUE SPACE GLOW -->

  <radialGradient id="blueGlow" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#1677ff" stop-opacity=".20"/>
    <stop offset="35%" stop-color="#0b4fa8" stop-opacity=".10"/>
    <stop offset="70%" stop-color="#082c5d" stop-opacity=".035"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- SECONDARY BLUE GLOW -->

  <radialGradient id="blueGlow2" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#00b7ff" stop-opacity=".11"/>
    <stop offset="45%" stop-color="#1265b5" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- GLASS -->

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".075"/>
    <stop offset="35%" stop-color="#8ccfff" stop-opacity=".025"/>
    <stop offset="70%" stop-color="#0a4d8f" stop-opacity=".025"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity=".035"/>
  </linearGradient>

  <!-- GRID -->

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path
      d="M32 0H0V32"
      fill="none"
      stroke="#4faaff"
      stroke-opacity=".035"/>
  </pattern>

  <!-- GLOW -->

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================= -->
<!-- BACKGROUND -->
<!-- ================================= -->

<rect
  width="1200"
  height="520"
  rx="24"
  fill="url(#bg)"
/>

<!-- MAIN BLUE AMBIENT -->

<ellipse
  cx="600"
  cy="255"
  rx="560"
  ry="300"
  fill="url(#blueGlow)"
>
  <animate
    attributeName="cx"
    values="560;640;560"
    dur="18s"
    repeatCount="indefinite"/>
</ellipse>

<!-- SIDE BLUE LIGHT -->

<ellipse
  cx="150"
  cy="250"
  rx="300"
  ry="280"
  fill="url(#blueGlow2)"
>
  <animate
    attributeName="cy"
    values="250;210;250"
    dur="16s"
    repeatCount="indefinite"/>
</ellipse>


<!-- ================================= -->
<!-- OUTER FRAME -->
<!-- ================================= -->

<rect
  x="14"
  y="14"
  width="1172"
  height="492"
  rx="20"
  fill="url(#grid)"
  stroke="#328cff"
  stroke-opacity=".30"
/>


<!-- ================================= -->
<!-- TEMPERED GLASS -->
<!-- ================================= -->

<rect
  x="28"
  y="28"
  width="1144"
  height="464"
  rx="20"
  fill="url(#glass)"
  stroke="#8bcfff"
  stroke-opacity=".055"
/>

<!-- glass reflection -->

<path
  d="M55 62 Q600 34 1145 62"
  fill="none"
  stroke="#ffffff"
  stroke-opacity=".085"
/>

<path
  d="M85 73 Q600 52 1115 73"
  fill="none"
  stroke="#5dbbff"
  stroke-opacity=".045"
/>


<!-- ================================= -->
<!-- HUD CORNERS -->
<!-- ================================= -->

<g
