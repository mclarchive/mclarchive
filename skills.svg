<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- ================================= -->
  <!-- DARK NAVY SPACE BACKGROUND -->
  <!-- ================================= -->

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#02050d"/>
    <stop offset="38%" stop-color="#061326"/>
    <stop offset="68%" stop-color="#08172d"/>
    <stop offset="100%" stop-color="#02040a"/>
  </linearGradient>

  <!-- BLUE SPACE GLOW -->

  <radialGradient id="blueGlow" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#1677ff" stop-opacity=".20"/>
    <stop offset="35%" stop-color="#0b4fa8" stop-opacity=".10"/>
    <stop offset="70%" stop-color="#082c5d" stop-opacity=".035"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- SECONDARY BLUE GLOW -->

  <radialGradient id="blueGlow2" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#00b7ff" stop-opacity=".11"/>
    <stop offset="45%" stop-color="#1265b5" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- GRID -->
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path
      d="M32 0H0V32"
      fill="none"
      stroke="#00ffd5"
      stroke-opacity=".028"/>
  </pattern>

  <!-- GLOW -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================= -->
<!-- BACKGROUND -->
<!-- ================================= -->

<rect
  width="1200"
  height="520"
  rx="24"
  fill="url(#bg)"
/>

<!-- ambient lights -->

<ellipse
  cx="170"
  cy="180"
  rx="430"
  ry="300"
  fill="url(#cyanGlow)"
>
  <animate
    attributeName="cx"
    values="170;260;170"
    dur="18s"
    repeatCount="indefinite"/>
</ellipse>

<ellipse
  cx="1050"
  cy="360"
  rx="420"
  ry="300"
  fill="url(#blueGlow)"
>
  <animate
    attributeName="cy"
    values="360;300;360"
    dur="20s"
    repeatCount="indefinite"/>
</ellipse>

<!-- subtle grid -->

<rect
  x="14"
  y="14"
  width="1172"
  height="492"
  rx="20"
  fill="url(#grid)"
  stroke="#00ffd5"
  stroke-opacity=".25"
/>


<!-- ================================= -->
<!-- GLASS PANEL -->
<!-- ================================= -->

<rect
  x="28"
  y="28"
  width="1144"
  height="464"
  rx="20"
  fill="url(#glass)"
  stroke="#ffffff"
  stroke-opacity=".045"
/>

<!-- glass reflection -->

<path
  d="M55 62 Q600 35 1145 62"
  fill="none"
  stroke="#ffffff"
  stroke-opacity=".08"
/>

<path
  d="M80 72 Q600 52 1120 72"
  fill="none"
  stroke="#00ffd5"
  stroke-opacity=".035"
/>


<!-- ================================= -->
<!-- HUD CORNERS -->
<!-- ================================= -->

<g
  fill="none"
  stroke="#00ffd5"
  stroke-opacity=".42"
  stroke-width="1">

  <path d="M42 105V42H105"/>
  <path d="M1095 42H1158V105"/>
  <path d="M42 415V478H105"/>
  <path d="M1095 478H1158V415"/>

</g>


<!-- ================================= -->
<!-- HEADER -->
<!-- ================================= -->

<text
