<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030708"></stop>
    <stop offset=".5" stop-color="#081816"></stop>
    <stop offset="1" stop-color="#020405"></stop>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>

  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#00ffd5" stroke-opacity=".045"></path>
  </pattern>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="330" rx="24" fill="url(#bg)"></rect>

<rect x="14" y="14" width="1172" height="302" rx="20" fill="url(#grid)" stroke="#00ffd5" stroke-opacity=".38"></rect>

<!-- MOVING SCANLINE -->
<rect x="60" y="70" width="1080" height="2" fill="#00ffd5" opacity=".6" filter="url(#glow)">

<animate attributeName="y" values="70;280;70" dur="3.8s" repeatCount="indefinite"></animate>

</rect>

<!-- HEADER -->

