<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#010207"/>
    <stop offset=".35" stop-color="#050817"/>
    <stop offset=".65" stop-color="#0b0820"/>
    <stop offset="1" stop-color="#010207"/>
  </linearGradient>

  <radialGradient id="spaceGlow">
    <stop offset="0" stop-color="#7d4cff" stop-opacity=".18"/>
    <stop offset=".35" stop-color="#4f2cc7" stop-opacity=".08"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueGlow">
    <stop offset="0" stop-color="#247bff" stop-opacity=".13"/>
    <stop offset=".45" stop-color="#1454b5" stop-opacity=".045"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- GLASS -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/>
    <stop offset=".45" stop-color="#9b72ff" stop-opacity=".035"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".025"/>
  </linearGradient>

  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9f7aff" stop-opacity=".20"/>
    <stop offset=".5" stop-color="#5532b8" stop-opacity=".07"/>
    <stop offset="1" stop-color="#1d6eff" stop-opacity=".12"/>
  </linearGradient>

  <!-- GRID -->
  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path
      d="M35 0H0V35"
      fill="none"
      stroke="#9c7aff"
      stroke-opacity=".035"/>
  </pattern>

  <!-- STARS -->
  <pattern id="stars" width="180" height="120" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="20" r="1" fill="#ffffff" opacity=".45"/>
    <circle cx="70" cy="82" r=".8" fill="#bba7ff" opacity=".55"/>
    <circle cx="130" cy="38" r=".7" fill="#ffffff" opacity=".4"/>
    <circle cx="165" cy="105" r="1" fill="#8dbaff" opacity=".5"/>
    <circle cx="100" cy="110" r=".6" fill="#ffffff" opacity=".35"/>
  </pattern>

  <!-- GLOW -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow">
    <feGaussianBlur stdDeviation="13"/>
  </filter>

</defs>


<!-- ================================================= -->
<!-- SPACE BACKGROUND -->
<!-- ================================================= -->

<rect
  width="1200"
  height="430"
  rx="26"
  fill="url(#space)"/>

<rect
  width="1200"
  height="430"
  rx="26"
  fill="url(#stars)"/>

<ellipse
