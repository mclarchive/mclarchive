  cy="220"
  rx="560"
  ry="280"
  fill="url(#spaceGlow)">

  <animate
    attributeName="cx"
    values="500;700;500"
    dur="18s"
    repeatCount="indefinite"/>

</ellipse>

<ellipse
  cx="1100"
  cy="100"
  rx="300"
  ry="240"
  fill="url(#blueGlow)"/>


