<svg width="1200" height="430" viewBox="0 0 1200 430"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#01030a"/>
    <stop offset="45%" stop-color="#05091a"/>
    <stop offset="70%" stop-color="#0b0820"/>
    <stop offset="100%" stop-color="#010208"/>
  </linearGradient>

  <radialGradient id="purpleGlow">
    <stop offset="0%" stop-color="#855cff" stop-opacity=".25"/>
    <stop offset="45%" stop-color="#6438d8" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueGlow">
    <stop offset="0%" stop-color="#287cff" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- GLASS -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".075"/>
    <stop offset="50%" stop-color="#8d6aff" stop-opacity=".025"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity=".015"/>
  </linearGradient>

  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#15142d"/>
    <stop offset="100%" stop-color="#080a17"/>
  </linearGradient>

  <!-- GRID -->
  <pattern id="grid" width="35" height="35"
           patternUnits="userSpaceOnUse">
    <path d="M35 0H0V35"
          fill="none"
          stroke="#9275ff"
          stroke-opacity=".045"/>
  </pattern>

  <!-- SOFT GLOW -->
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="3"/>
  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect
  width="1200"
  height="430"
  rx="26"
  fill="url(#bg)"/>

<ellipse
  cx="500"
  cy="230"
  rx="520"
  ry="280"
  fill="url(#purpleGlow)">

  <animate
    attributeName="cx"
    values="450;650;450"
    dur="14s"
    repeatCount="indefinite"/>

</ellipse>

<ellipse
  cx="1050"
  cy="100"
  rx="330"
  ry="250"
  fill="url(#blueGlow)">

  <animate
    attributeName="cy"
    values="80;130;80"
    dur="11s"
    repeatCount="indefinite"/>

</ellipse>


