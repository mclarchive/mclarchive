<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="50%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#020617"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1200" height="300" rx="24" fill="url(#bg)"/>

<circle cx="170" cy="100" r="180" fill="url(#glow)">
  <animate attributeName="cx" values="170;300;170" dur="8s" repeatCount="indefinite"/>
</circle>

<circle cx="1030" cy="210" r="220" fill="url(#glow)">
  <animate attributeName="cy" values="210;120;210" dur="9s" repeatCount="indefinite"/>
</circle>

<g opacity=".18">
  <path d="M0 240 L240 0" stroke="white"/>
  <path d="M180 300 L480 0" stroke="white"/>
  <path d="M720 300 L1020 0" stroke="white"/>
  <path d="M930 300 L1200 30" stroke="white"/>
</g>

<g fill="white" font-family="Arial, sans-serif">
  <text x="600" y="125" text-anchor="middle"
        font-size="46" font-weight="700">
    BUILD. LEARN. CREATE.
  </text>

<text x="600" y="165" text-anchor="middle"
     font-size="18" opacity=".65">
Robotics • AI • Software • Electronics </text> </g>

<circle cx="80" cy="70" r="3" fill="white">
  <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
</circle>

<circle cx="1120" cy="80" r="3" fill="white">
  <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
</circle>

</svg>
