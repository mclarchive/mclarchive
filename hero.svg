<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="50%" stop-color="#07111f"/>
    <stop offset="100%" stop-color="#02040a"/>
  </linearGradient>

  <!-- GLASS -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
    <stop offset="45%" stop-color="#38bdf8" stop-opacity=".035"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity=".055"/>
  </linearGradient>

  <!-- GLASS EDGE -->
  <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity=".05"/>
    <stop offset="50%" stop-color="#7dd3fc" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity=".05"/>
  </linearGradient>

  <!-- BLUE LIGHT -->
  <radialGradient id="blueLight">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".28"/>
    <stop offset="45%" stop-color="#2563eb" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
  </radialGradient>

  <!-- PURPLE LIGHT -->
  <radialGradient id="purpleLight">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".20"/>
    <stop offset="50%" stop-color="#6366f1" stop-opacity=".07"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>

  <!-- CYAN GLOW -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================= -->
<!-- DARK SPACE -->
<!-- ================================= -->

<rect
  width="1200"
  height="420"
  rx="28"
  fill="url(#background)"
/>


<!-- ================================= -->
<!-- AMBIENT LIGHT -->
<!-- ================================= -->

<ellipse
  cx="150"
  cy="100"
  rx="380"
  ry="250"
  fill="url(#blueLight)">

  <animate
    attributeName="cx"
    values="150;260;150"
    dur="14s"
    repeatCount="indefinite"/>

</ellipse>


<ellipse
  cx="1050"
  cy="320"
  rx="380"
  ry="250"
  fill="url(#purpleLight)">

  <animate
    attributeName="cy"
    values="320;230;320"
    dur="16s"
    repeatCount="indefinite"/>

</ellipse>


<!-- ================================= -->
<!-- GLASS PANEL -->
<!-- ================================= -->

<rect
  x="35"
  y="28"
  width="1130"
  height="364"
  rx="24"
  fill="url(#glass)"
  stroke="#ffffff"
  stroke-opacity=".10"
  stroke-width="1"
/>


<!-- ================================= -->
<!-- GLASS TOP REFLECTION -->
<!-- ================================= -->

<path
  d="M60 55
     Q600 25 1140 55"
  fill="none"
  stroke="#ffffff"
  stroke-opacity=".13"
  stroke-width="1"
/>


<path
  d="M80 70
     Q600 45 1120 70"
  fill="none"
  stroke="#38bdf8"
  stroke-opacity=".08"
  stroke-width="1"
/>


<!-- ================================= -->
<!-- HOLOGRAPHIC GRID -->
<!-- ================================= -->

<g
  stroke="#38bdf8"
  stroke-opacity=".045"
  stroke-width="1">

  <line x1="100" y1="30" x2="100" y2="390"/>
  <line x1="200" y1="30" x2="200" y2="390"/>
  <line x1="300" y1="30" x2="300" y2="390"/>
  <line x1="400" y1="30" x2="400" y2="390"/>
  <line x1="500" y1="30" x2="500" y2="390"/>
  <line x1="600" y1="30" x2="600" y2="390"/>
  <line x1="700" y1="30" x2="700" y2="390"/>
  <line x1="800" y1="30" x2="800" y2="390"/>
  <line x1="900" y1="30" x2="900" y2="390"/>
  <line x1="1000" y1="30" x2="1000" y2="390"/>
  <line x1="1100" y1="30" x2="1100" y2="390"/>

  <line x1="35" y1="90" x2="1165" y2="90"/>
  <line x1="35" y1="150" x2="1165" y2="150"/>
  <line x1="35" y1="210" x2="1165" y2="210"/>
  <line x1="35" y1="270" x2="1165" y2="270"/>
  <line x1="35" y1="330" x2="1165" y2="330"/>

</g>


<!-- ================================= -->
<!-- STARS -->
<!-- ================================= -->

<g fill="white">

  <circle cx="90" cy="80" r="1.5">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="160" cy="300" r="1">
    <animate
      attributeName="opacity"
      values="1;.2;1"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="270" cy="75" r="1.5">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="2.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="930" cy="75" r="1.5">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="125" r="1">
    <animate
      attributeName="opacity"
      values="1;.2;1"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1110" cy="340" r="1.5">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

</g>


<!-- ================================= -->
<!-- CORNER HUD -->
<!-- ================================= -->

<g
  fill="none"
  stroke="#38bdf8"
  stroke-opacity=".35"
  stroke-width="1">

  <path d="M55 105 V55 H105"/>
  <path d="M1095 55 H1145 V105"/>
  <path d="M55 315 V365 H105"/>
  <path d="M1095 365 H1145 V315"/>

</g>


<!-- ================================= -->
<!-- TOP LABEL -->
<!-- ================================= -->

<text
  x="600"
  y="78"
  text-anchor="middle"
  font-family="monospace"
  font-size="11"
  letter-spacing="5"
  fill="#64748b">
  CHEL // PROFIL INTERFACE
</text>


<!-- ================================= -->
<!-- MAIN NAME -->
<!-- ================================= -->

<text
  x="600"
  y="153"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="54"
  font-weight="700"
  letter-spacing="10"
  fill="white"
  filter="url(#glow)">
  MICHAEL
</text>


<!-- ================================= -->
<!-- DESCRIPTION -->
<!-- ================================= -->

<text
  x="600"
  y="184"
  text-anchor="middle"
  font-family="monospace"
  font-size="15"
  letter-spacing="3"
  fill="#cbd5e1">
  COMPUTER SCIENCE • HARDWARE • BUILDING
</text>


<!-- ================================= -->
<!-- CENTRAL HUD -->
<!-- ================================= -->

<line
  x1="330"
  y1="211"
  x2="870"
  y2="211"
  stroke="#38bdf8"
  stroke-opacity=".12"
/>

<line
  x1="470"
  y1="211"
  x2="730"
  y2="211"
  stroke="#38bdf8"
  stroke-opacity=".40"
/>


<circle
  cx="600"
  cy="211"
  r="3"
  fill="#38bdf8"
  filter="url(#glow)">

  <animate
    attributeName="r"
    values="2;5;2"
    dur="2s"
    repeatCount="indefinite"/>

</circle>


<!-- ================================= -->
<!-- INTERFACE -->
<!-- ================================= -->

<text
  x="600"
  y="238"
  text-anchor="middle"
  font-family="monospace"
  font-size="11"
  letter-spacing="4"
  fill="#64748b">
  INTERFACE //  // ACTIVE
</text>


<!-- ================================= -->
<!-- EXPLORING -->
<!-- ================================= -->

<text
  x="600"
  y="273"
  text-anchor="middle"
  font-family="monospace"
  font-size="13"
  letter-spacing="2"
  fill="#94a3b8">
  EXPLORING // ARDUINO • C++ • PYTHON • CS FUNDAMENTALS
</text>


<!-- ================================= -->
<!-- PROJECT -->
<!-- ================================= -->

<text
  x="600"
  y="309"
  text-anchor="middle"
  font-family="monospace"
  font-size="10"
  letter-spacing="4"
  fill="#475569">
  ACTIVE DEVELOPMENT
</text>


<text
  x="600"
  y="336"
  text-anchor="middle"
  font-family="monospace"
  font-size="15"
  letter-spacing="2"
  fill="#e2e8f0">
  ASSISTIVE DEVICE // GUIDE
</text>


<!-- ================================= -->
<!-- STATUS -->
<!-- ================================= -->

<g font-family="monospace">

  <circle
    cx="505"
    cy="365"
    r="2.5"
    fill="#38bdf8"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>

  <text
    x="518"
    y="369"
    font-size="10"
    letter-spacing="2"
    fill="#64748b">
    PROJECT // DEVELOPMENT
  </text>

</g>


<!-- ================================= -->
<!-- MOVING PARTICLE -->
<!-- ================================= -->

<circle
  cx="300"
  cy="200"
  r="2"
  fill="#38bdf8"
  filter="url(#glow)">

  <animateMotion
    path="M0,0 C200,-100 500,-100 900,0"
    dur="9s"
    repeatCount="indefinite"/>

</circle>


<!-- ================================= -->
<!-- GLASS BORDER -->
<!-- ================================= -->

<rect
  x="35"
  y="28"
  width="1130"
  height="364"
  rx="24"
  fill="none"
  stroke="url(#glassEdge)"
  stroke-width="1.5"
/>


</svg>
