<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- SPACE BACKGROUND -->

  <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="45%" stop-color="#0b1120"/>
    <stop offset="100%" stop-color="#02030a"/>
  </linearGradient>

  <!-- BLUE NEBULA -->

  <radialGradient id="nebulaBlue">
    <stop offset="0%" stop-color="#2563eb" stop-opacity=".28"/>
    <stop offset="35%" stop-color="#1d4ed8" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
  </radialGradient>

  <!-- PURPLE NEBULA -->

  <radialGradient id="nebulaPurple">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity=".20"/>
    <stop offset="40%" stop-color="#6366f1" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>

  <!-- GLOW -->

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- STAR GLOW -->

  <filter id="starGlow">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect
width="1200"
height="420"
rx="28"
fill="url(#space)"
/>

<!-- NEBULA -->

<ellipse
cx="160"
cy="120"
rx="360"
ry="250"
fill="url(#nebulaBlue)"

>

<animate
 attributeName="cx"
 values="160;280;160"
 dur="12s"
 repeatCount="indefinite"
/> </ellipse>

<ellipse
cx="1050"
cy="310"
rx="360"
ry="250"
fill="url(#nebulaPurple)"

>

<animate
 attributeName="cy"
 values="310;210;310"
 dur="14s"
 repeatCount="indefinite"
/> </ellipse>

<!-- STARS -->

<g fill="white">

  <circle cx="70" cy="55" r="1.5">
    <animate attributeName="opacity"
      values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="145" cy="250" r="1">
    <animate attributeName="opacity"
      values="1;.2;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="250" cy="70" r="1.5">
    <animate attributeName="opacity"
      values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="360" cy="300" r="1">
    <animate attributeName="opacity"
      values=".1;.9;.1" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="890" cy="65" r="1.5">
    <animate attributeName="opacity"
      values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1010" cy="145" r="1">
    <animate attributeName="opacity"
      values="1;.2;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1130" cy="80" r="1.5">
    <animate attributeName="opacity"
      values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="350" r="1">
    <animate attributeName="opacity"
      values=".1;1;.1" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="760" cy="330" r="1.5">
    <animate attributeName="opacity"
      values=".3;1;.3" dur="3.8s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- LARGE DISTANT STARS -->

<g fill="white" filter="url(#starGlow)">

  <circle cx="105" cy="145" r="3">
    <animate attributeName="opacity"
      values=".1;.8;.1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="230" r="3">
    <animate attributeName="opacity"
      values=".2;1;.2" dur="5s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- SUBTLE SPACE ORBIT -->

<ellipse
cx="600"
cy="205"
rx="520"
ry="170"
fill="none"
stroke="#94a3b8"
stroke-opacity=".05"
stroke-width="1"

>

<animateTransform
 attributeName="transform"
 type="rotate"
 from="0 600 205"
 to="360 600 205"
 dur="35s"
 repeatCount="indefinite"
/> </ellipse>

<!-- TOP SYSTEM LABEL -->

<g
font-family="monospace"
fill="#94a3b8"

>

<text
x="600"
y="72"
text-anchor="middle"
font-size="14"
letter-spacing="4"

>

```
SYSTEM // PROFILE INITIALIZATION
```

  </text>

</g>

<!-- STATUS -->

<g
font-family="monospace"
font-size="12"

>

<circle
cx="445"
cy="103"
r="4"
fill="#22c55e"
filter="url(#glow)"

>

```
<animate
```

```
  attributeName="opacity"
  values=".3;1;.3"
  dur="2s"
  repeatCount="indefinite"
/>
```

  </circle>

<text
x="458"
y="107"
fill="#64748b"
letter-spacing="2"

>

```
SYSTEM ONLINE
```

  </text>

</g>

<!-- MAIN NAME -->

<text
x="600"
y="155"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="52"
font-weight="700"
letter-spacing="8"
fill="white"
filter="url(#glow)"

>

MICHAEL </text>

<!-- DESCRIPTION -->

<text
x="600"
y="187"
text-anchor="middle"
font-family="monospace"
font-size="16"
letter-spacing="3"
fill="#cbd5e1"

>

COMPUTER SCIENCE • HARDWARE • BUILDING </text>

<!-- INTERFACE LINE -->

<g font-family="monospace">

<line
x1="390"
y1="220"
x2="810"
y2="220"
stroke="#38bdf8"
s
